name: Build SHADOWX-FB APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release Type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    # ✅ BETTER: Use Gradle Wrapper Validation
    - name: Validate Gradle Wrapper
      uses: gradle/wrapper-validation-action@v1

    # ✅ BETTER: Setup Gradle with cache
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'
        cache-read-only: false

    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties

    - name: Build APK
      run: |
        if [ "${{ github.event.inputs.release_type }}" == "release" ]; then
          echo "🔨 Building Release APK..."
          gradle assembleRelease --stacktrace
        else
          echo "🔨 Building Debug APK..."
          gradle assembleDebug --stacktrace
        fi

    - name: List APK Files
      run: |
        echo "📦 Built APKs:"
        find app/build/outputs/apk/ -name "*.apk" -type f

    - name: Upload APK - Debug
      if: github.event.inputs.release_type == 'debug' || github.event.inputs.release_type == ''
      uses: actions/upload-artifact@v4
      with:
        name: SHADOWX-FB-debug
        path: app/build/outputs/apk/debug/*.apk

    - name: Upload APK - Release
      if: github.event.inputs.release_type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: SHADOWX-FB-release
        path: app/build/outputs/apk/release/*.apk

    - name: Generate Release Notes
      if: github.event.inputs.release_type == 'release'
      run: |
        echo "# SHADOWX-FB Release" > release_notes.md
        echo "" >> release_notes.md
        echo "## Features" >> release_notes.md
        echo "- ✅ Ad Blocking" >> release_notes.md
        echo "- ✅ Offline Mode (300 Reels, 300 News)" >> release_notes.md
        echo "- ✅ Dark/Light Theme" >> release_notes.md
        echo "- ✅ Multi Language Support" >> release_notes.md
        echo "- ✅ Messenger Integration" >> release_notes.md
        echo "- ✅ Background Playback" >> release_notes.md
        echo "- ✅ Customizable UI" >> release_notes.md
        echo "" >> release_notes.md
        echo "## Developer" >> release_notes.md
        echo "👨‍💻 Mueid Mursalin Rifat" >> release_notes.md
        echo "📱 Contact: https://www.facebook.com/mueid.mursalin.rifat1" >> release_notes.md

    - name: Create Release
      if: github.event.inputs.release_type == 'release'
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ github.run_number }}
        name: SHADOWX-FB v${{ github.run_number }}
        body_path: release_notes.md
        files: |
          app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
